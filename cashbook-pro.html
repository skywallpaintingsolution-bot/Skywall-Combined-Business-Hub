<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skywall Cash Book Pro</title><meta name="theme-color" content="#123b86"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--n:#123b86;--in:#137547;--out:#c0392b;--bg:#f4f6fb;--line:#e3e8f1;--mut:#6b7686;--ink:#1c2433;--chip:#e8efff}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select{font:inherit}button{cursor:pointer;border:0}
#app{max-width:780px;margin:0 auto;min-height:100vh;padding-bottom:150px}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.top img{width:36px;height:36px;border-radius:9px}.top h1{font-size:17px;margin:0;flex:1;color:var(--n);line-height:1.2}.top small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.ib{background:none;font-size:20px;padding:6px 9px;border-radius:9px;color:var(--n)}.ib:active{background:var(--chip)}
.wrap{padding:12px 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mut{color:var(--mut);font-size:12px}.in{color:var(--in)}.out{color:var(--out)}b.big{font-size:22px}
.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}
.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 8px}.chip{white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--n);padding:7px 12px;border-radius:20px;font-size:13px}.chip.on{background:var(--n);color:#fff;border-color:var(--n)}
.book{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}.book:active{background:var(--chip)}
.bi{width:40px;height:40px;border-radius:11px;background:var(--chip);display:grid;place-items:center;font-size:20px}
.sum .r{display:flex;justify-content:space-between;padding:5px 0}.sum .net{border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:4px;font-weight:700;font-size:17px}
.links{display:flex;border-top:1px solid var(--line);margin-top:8px}.links button{flex:1;background:none;color:var(--n);font-weight:700;padding:11px}
.day{color:var(--mut);font-size:13px;margin:12px 2px 6px}
.ent{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.tag{display:inline-block;background:var(--chip);color:var(--n);font-size:11px;padding:3px 9px;border-radius:12px;margin:5px 5px 0 0}
.fab{position:fixed;left:0;right:0;bottom:56px;z-index:9;display:flex;gap:10px;padding:10px 14px;max-width:780px;margin:0 auto;background:linear-gradient(transparent,var(--bg) 35%)}
.fab button{flex:1;padding:14px;border-radius:11px;color:#fff;font-weight:700;font-size:16px}.bin{background:var(--in)}.bout{background:var(--out)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:11;background:#fff;border-top:1px solid var(--line);display:flex;max-width:780px;margin:0 auto}
.nav button{flex:1;background:none;padding:8px 2px;color:var(--mut);font-size:11px}.nav button span{display:block;font-size:20px}.nav button.on{color:var(--n);font-weight:700}
.pbtn{background:var(--n);color:#fff;padding:13px;border-radius:11px;font-weight:700;width:100%}.sbtn{background:#fff;color:var(--n);border:1.5px solid var(--n);padding:12px;border-radius:11px;font-weight:700;width:100%}
.ov{position:fixed;inset:0;background:#0b1530b0;z-index:30;display:none;align-items:flex-end;justify-content:center}.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}.f{width:100%;padding:12px;border:1px solid #cfd7e6;border-radius:10px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts{display:flex;gap:10px;margin-top:14px}.acts>*{flex:1}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}.opt.on{background:var(--chip);border-color:var(--n)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right}
.bar{height:8px;background:#e5eaf5;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--n)}
.chart{display:flex;align-items:flex-end;gap:10px;height:140px}.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.chart .p{display:flex;gap:3px;align-items:flex-end;flex:1;width:100%}.chart .p i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.chat{display:flex;flex-direction:column;gap:8px}.msg{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.55}.q{align-self:flex-end;background:var(--n);color:#fff}.a{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.askbar{position:fixed;left:0;right:0;bottom:56px;max-width:780px;margin:0 auto;display:flex;gap:8px;padding:10px 14px;background:var(--bg);z-index:9}.askbar input{flex:1}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#pa{display:none}
@media print{body{background:#fff}#app,.nav,.fab,.ov,.askbar{display:none!important}#pa{display:block!important}}
#pa h2{color:#123b86;margin:0}#pa table{font-size:11px}#pa th{background:#eaf0fb}
</style></head><body>
<div id="app"></div><nav class="nav" id="nav"></nav><div class="ov" id="ov"><div class="sheet" id="sheet"></div></div><div id="pa"></div>

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=()=>new Date().toLocaleDateString('sv'),lt=()=>new Date().toTimeString().slice(0,5);
const ru=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n*100)/100).toLocaleString('en-IN');
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db||{books:[],entries:[],parties:[],cats:['Staff Salary','Advance','Tools charge','Deposit','Labour Charges','Materials','Food','Petrol','Customer Payment','Transport'],modes:['Cash','Online'],seq:1};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('சேமிக்க இடம் இல்லை. Backup எடுத்து பழைய பதிவுகளை நீக்கவும்.')}render()}
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
let V={tab:'books',book:null,q:'',f:{type:'',cat:'',party:'',mode:'',from:'',to:''},dper:'month',chat:[],bq:''};
const lcats=()=>{db.lcats=db.lcats||['Labour Charges','Staff Salary','Advance'];return db.lcats};
function pl(list){let rec=0,lab=0,oth=0;list.forEach(e=>{const a=+e.amount;if(e.type==='IN')rec+=a;else if(lcats().includes(e.category))lab+=a;else oth+=a});return{rec,lab,oth,after:rec-lab,profit:rec-lab-oth}}
const plw=n=>n<0?'நஷ்டம்':n>0?'லாபம்':'சமம்';
function bookOf(id){return db.books.find(b=>b.id===id)}
function ents(bid){return db.entries.filter(e=>!bid||e.bookId===bid)}
function tot(list){let i=0,o=0;list.forEach(e=>e.type==='IN'?i+=+e.amount:o+=+e.amount);return{i,o,n:i-o}}
function stamp(e){return e.date+' '+(e.time||'00:00')}
function ago(ts){if(!ts)return'';const m=Math.round((Date.now()-ts)/6e4);if(m<1)return'இப்போது';if(m<60)return m+' நிமிடம் முன்';if(m<1440)return Math.round(m/60)+' மணி முன்';return new Date(ts).toLocaleDateString('en-GB')}
function fdate(d){const x=new Date(d+'T00:00');return x.toLocaleDateString('ta-IN',{day:'numeric',month:'long',year:'numeric'})}
/* ---------- period helpers ---------- */
function rng(p){const t=new Date(ld()+'T00:00'),f=d=>d.toLocaleDateString('sv'),a=new Date(t);
 if(p==='today')return[f(t),f(t)];if(p==='yday'){a.setDate(a.getDate()-1);return[f(a),f(a)]}
 if(p==='week'){a.setDate(a.getDate()-((a.getDay()+6)%7));return[f(a),f(t)]}
 if(p==='month')return[f(new Date(t.getFullYear(),t.getMonth(),1)),f(t)];
 if(p==='lmonth')return[f(new Date(t.getFullYear(),t.getMonth()-1,1)),f(new Date(t.getFullYear(),t.getMonth(),0))];
 if(p==='year')return[f(new Date(t.getFullYear(),0,1)),f(t)];return['',''] }
const PN={all:'எல்லாம்',today:'இன்று',yday:'நேற்று',week:'இந்த வாரம்',month:'இந்த மாதம்',lmonth:'கடந்த மாதம்',year:'இந்த ஆண்டு'};
/* ---------- render ---------- */
function render(){
 $('nav').innerHTML=[['books','📚','புத்தகங்கள்'],['dash','📊','டாஷ்போர்டு'],['ask','💬','கேளுங்கள்'],['set','⚙️','அமைப்பு']].map(x=>`<button class="${V.tab===x[0]?'on':''}" onclick="V.tab='${x[0]}';V.book=null;render();scrollTo(0,0)"><span>${x[1]}</span>${x[2]}</button>`).join('');
 const m={books:V.book?vBook:vBooks,dash:vDash,ask:vAsk,set:vSet}[V.tab];$('app').innerHTML=m();
 if(V.tab==='ask'){const c=document.querySelector('.chat');if(c)scrollTo(0,document.body.scrollHeight)}
}
function topbar(t,sub,back,extra){return `<div class="top">${back?`<button class="ib" onclick="V.book=null;render()">←</button>`:`<img src="${LOGO}">`}<h1>${esc(t)}${sub?`<small>${esc(sub)}</small>`:''}</h1>${extra||''}</div>`}
/* ---------- books list ---------- */
function vBooks(){
 const q=V.bq.toLowerCase(),L=db.books.filter(b=>b.name.toLowerCase().includes(q)).sort((a,b)=>(b.updated||0)-(a.updated||0));
 return topbar('Sky Wall Painting','Skywall வணிகம் · தள வாரியான புத்தகங்கள்',false,'<button class="ib" onclick="addBook()">＋</button>')+`<div class="wrap"><input class="search" placeholder="🔍 புத்தகம் தேடு" value="${esc(V.bq)}" oninput="V.bq=this.value;render();document.querySelector('.search').focus()">
 <div class="book" style="margin-top:12px;border-style:dashed" onclick="addBook()"><div class="bi">＋</div><div><b>புதிய புத்தகம் சேர்</b><div class="mut">ஒவ்வொரு Site / வேலைக்கும் தனி புத்தகம்</div></div></div>`+
 (L.map(b=>{const t=tot(ents(b.id));return `<div class="book" onclick="openBook(${b.id})"><div class="bi">📘</div><div class="sp"><b>${esc(b.name)}</b><div class="mut">புதுப்பிப்பு: ${ago(b.updated)||'—'} · ${ents(b.id).length} பதிவுகள்</div></div><div style="text-align:right"><b class="${t.n<0?'out':'in'}">${ru(Math.abs(t.n))}</b><div class="mut ${t.n<0?'out':'in'}">${plw(t.n)}</div></div><button class="ib" onclick="event.stopPropagation();bookMenu(${b.id})">⋮</button></div>`}).join('')||`<div class="empty">புத்தகங்கள் இல்லை.<br>மேலே “புதிய புத்தகம்” அழுத்தவும்.</div>`)+'</div>'}
function addBook(){const n=prompt('புதிய புத்தகத்தின் பெயர் (எ.கா. Koovam School):');if(!n||!n.trim())return;db.books.push({id:uid(),name:n.trim(),updated:Date.now()});save()}

 <div class="card sum"><div class="r net"><span>நிகர மீதி / Net Balance</span><span class="${t.n<0?'out':'in'}">${ru(t.n)}</span></div><div class="r"><span>மொத்த வரவு (+)</span><b class="in">${ru(t.i)}</b></div><div class="r"><span>மொத்த செலவு (−)</span><b class="out">${ru(t.o)}</b></div>

 return topbar('கேளுங்கள்','உங்கள் கணக்கு பற்றி தமிழில் கேள்வி கேளுங்கள்')+`<div class="wrap"><div class="chips">${sug.map(x=>`<button class="chip" onclick="ask('${x}')">${x}</button>`).join('')}</div><div class="chat">${V.chat.map(m=>`<div class="msg q">${esc(m.q)}</div><div class="msg a">${esc(m.a)}</div>`).join('')||'<div class="empty">மேலே உள்ள கேள்வியைத் தொடவும் அல்லது கீழே தட்டச்சு செய்யவும்.</div>'}</div></div><div class="askbar"><input class="search" id="aq" placeholder="உங்கள் கேள்வி…" onkeydown="if(event.key==='Enter')ask()"><button class="pbtn" style="width:80px" onclick="ask()">கேள்</button></div>`}
/* ---------- settings ---------- */
function vSet(){return topbar('அமைப்பு','Backup · Category · இறக்குமதி')+`<div class="wrap">
 <div class="card"><b>💾 Backup / Restore</b><p class="mut">தரவு இந்த device-இல் மட்டுமே சேமிக்கப்படும். அடிக்கடி Backup எடுத்து Google Drive-இல் சேமிக்கவும்.</p><div class="acts"><button class="pbtn" onclick="backup()">Backup பதிவிறக்கு</button><label class="sbtn" style="text-align:center;display:block">Restore<input type="file" accept=".json" style="display:none" onchange="restore(this)"></label></div></div>
 <div class="card"><b>📥 Hub-ல் இருந்து இறக்குமதி</b><p class="mut">Skywall AI Business Hub-இன் Cash Book பதிவுகளை இங்கே கொண்டு வரலாம் (அதே தளத்தில் திறந்தால் தானாக, அல்லது Hub Backup JSON கோப்பு மூலம்).</p><div class="acts"><button class="sbtn" onclick="importHub()">இந்த browser-இல் இருந்து</button><label class="sbtn" style="text-align:center;display:block">JSON கோப்பு<input type="file" accept=".json" style="display:none" onchange="importHubFile(this)"></label></div></div>
 <div class="card"><b>👷 ஆட்கள் கூலி Category</b><p class="mut">இந்த Category-களில் உள்ள Cash Out பதிவுகள் "ஆட்கள் கூலி" ஆகக் கணக்காகும். மற்றவை "மற்ற செலவு". தொட்டு மாற்றவும்.</p><div class="chips" style="flex-wrap:wrap">${db.cats.map(c=>`<button class="chip ${lcats().includes(c)?'on':''}" onclick="togL('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('')}</div></div>${bizCard()}${vTally()}${['cats','modes'].map(k=>`<div class="card"><b>${k==='cats'?'🏷 Categories':'💳 Payment modes'}</b><div class="chips" style="flex-wrap:wrap">${db[k].map((c,i)=>`<span class="chip">${esc(c)} <a onclick="if(confirm('நீக்கவா?')){db.${k}.splice(${i},1);save()}" style="color:var(--out);margin-left:6px">✕</a></span>`).join('')}<button class="chip on" onclick="const n=prompt('புதிய பெயர்:');if(n&&n.trim()){db.${k}.push(n.trim());save()}">＋ புதிது</button></div></div>`).join('')}
 <div class="card"><b>ℹ️ பற்றி</b><p class="mut">Skywall Cash Book · Sky Wall Painting வணிகத்துக்கான site வாரி வரவு–செலவு கணக்கு.</p></div></div>`}


function bizHtml(){const b=(db.biz||{});if(!(b.upi||b.acc||b.bank||b.ifsc||b.holder))return'';const r=(l,v)=>v?`<div><span style="color:#667">${l}:</span> <b>${String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</b></div>`:'';
 return `<div style="margin-top:22px;padding:10px 14px;border:1.5px solid #123b86;border-radius:8px;font-size:12px;line-height:1.7;page-break-inside:avoid"><div style="font-weight:700;color:#123b86;margin-bottom:4px">கட்டண விவரம் / Payment Details (UPI &amp; Bank)</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 18px">${r('UPI ID',b.upi)}${r('GPay / PhonePe எண்',b.upiNo)}${r('கணக்கு பெயர்',b.holder)}${r('வங்கி',b.bank)}${r('கணக்கு எண்',b.acc)}${r('IFSC',b.ifsc)}${r('கிளை',b.branch)}</div></div>`}
function bizSet(k,v){db.biz=db.biz||{};db.biz[k]=v.trim();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}if(window.renderBiz)renderBiz()}
function bizCard(){const b=db.biz||{},f=(k,l,ph)=>`<div><label>${l}</label><input class="f" value="${String(b[k]||'').replace(/"/g,'&quot;')}" placeholder="${ph||''}" onchange="bizSet('${k}',this.value)"></div>`;
 return `<div class="card"><b>🏦 UPI & வங்கி விவரம்</b><p class="mut hint">இங்கே சேர்த்தால் எல்லா Print / PDF கோப்புகளின் கீழும் தானாக வரும்.</p><div class="two grid">${f('upi','UPI ID','name@bank')}${f('upiNo','GPay / PhonePe எண்','')}${f('holder','கணக்கு பெயர்','Sky Wall Painting')}${f('bank','வங்கி பெயர்','')}${f('acc','கணக்கு எண்','')}${f('ifsc','IFSC','')}${f('branch','கிளை','')}</div></div>`}
/* ---------- Tally export ---------- */
const X=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function tcfg(){db.tally=db.tally||{company:'Sky Wall Painting',cash:'Cash',bank:'Bank Account',from:'',to:'',bid:''};return db.tally}
function tsave(k,v){tcfg()[k]=v;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function tallyLedger(e){return(e.party||'').trim()||(e.category||'').trim()||'Suspense'}
function tallyList(){const c=tcfg();return db.entries.filter(e=>(!c.bid||String(e.bookId)===String(c.bid))&&(!c.from||e.date>=c.from)&&(!c.to||e.date<=c.to)).sort((a,b)=>stamp(a).localeCompare(stamp(b)))}
function tallyEnv(report,inner){const c=tcfg();return `<?xml version="1.0" encoding="UTF-8"?>\n<ENVELOPE><HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER><BODY><IMPORTDATA><REQUESTDESC><REPORTNAME>${report}</REPORTNAME><STATICVARIABLES><SVCURRENTCOMPANY>${X(c.company)}</SVCURRENTCOMPANY></STATICVARIABLES></REQUESTDESC><REQUESTDATA>\n${inner}</REQUESTDATA></IMPORTDATA></BODY></ENVELOPE>`}
function tallyMasters(){const c=tcfg(),L=tallyList(),led={};
 led[c.cash]='Cash-in-Hand';led[c.bank]='Bank Accounts';
 L.forEach(e=>{const n=tallyLedger(e);if(led[n])return;led[n]=e.party?(e.partyType==='S'?'Sundry Creditors':'Sundry Debtors'):(e.type==='IN'?'Indirect Incomes':'Indirect Expenses')});
 return tallyEnv('All Masters',Object.entries(led).map(([n,p])=>`<TALLYMESSAGE xmlns:UDF="TallyUDF"><LEDGER NAME="${X(n)}" ACTION="Create"><NAME>${X(n)}</NAME><PARENT>${X(p)}</PARENT></LEDGER></TALLYMESSAGE>\n`).join(''))}
function tallyVouchers(){const c=tcfg(),L=tallyList();let k=0;
 return tallyEnv('Vouchers',L.map(e=>{k++;const inn=e.type==='IN',amt=(+e.amount).toFixed(2),pty=X(tallyLedger(e)),acc=X(/^cash$/i.test(e.mode||'Cash')?c.cash:c.bank),vt=inn?'Receipt':'Payment',bn=(bookOf(e.bookId)||{}).name||'',nar=X([bn,e.category,e.remark].filter(Boolean).join(' | '));
  const P=`<ALLLEDGERENTRIES.LIST><LEDGERNAME>${pty}</LEDGERNAME><ISDEEMEDPOSITIVE>${inn?'No':'Yes'}</ISDEEMEDPOSITIVE><AMOUNT>${inn?amt:'-'+amt}</AMOUNT></ALLLEDGERENTRIES.LIST>`,C=`<ALLLEDGERENTRIES.LIST><LEDGERNAME>${acc}</LEDGERNAME><ISDEEMEDPOSITIVE>${inn?'Yes':'No'}</ISDEEMEDPOSITIVE><AMOUNT>${inn?'-'+amt:amt}</AMOUNT></ALLLEDGERENTRIES.LIST>`;
  return `<TALLYMESSAGE xmlns:UDF="TallyUDF"><VOUCHER VCHTYPE="${vt}" ACTION="Create" OBJVIEW="Accounting Voucher View"><DATE>${e.date.replace(/-/g,'')}</DATE><VOUCHERTYPENAME>${vt}</VOUCHERTYPENAME><VOUCHERNUMBER>${k}</VOUCHERNUMBER><PARTYLEDGERNAME>${pty}</PARTYLEDGERNAME><NARRATION>${nar}</NARRATION>${inn?C+P:P+C}</VOUCHER></TALLYMESSAGE>\n`}).join(''))}
function tallyExport(kind){const L=tallyList();if(!L.length){alert('இந்தத் தேர்வில் பதிவுகள் இல்லை.');return}const d=ld();
 if(kind==='m')dl('Tally_1_Ledgers_'+d+'.xml',tallyMasters(),'application/xml;charset=utf-8');else dl('Tally_2_Vouchers_'+d+'.xml',tallyVouchers(),'application/xml;charset=utf-8')}
function tallyBoth(){tallyExport('m');setTimeout(()=>tallyExport('v'),600)}
function vTally(){const c=tcfg(),L=tallyList(),t=tot(L);return `<div class="card"><b>🧾 Tally-க்கு Export</b><p class="mut">Tally Prime / ERP 9-இல் இறக்குமதி செய்ய XML கோப்புகள். முதலில் <b>Ledgers</b> கோப்பு, பிறகு <b>Vouchers</b> கோப்பு. Cash In = Receipt, Cash Out = Payment.</p>
 <label>Tally Company பெயர் (Tally-இல் உள்ளபடியே)</label><input class="f" value="${esc(c.company)}" onchange="tsave('company',this.value)">
 <div class="two"><div><label>Cash ledger</label><input class="f" value="${esc(c.cash)}" onchange="tsave('cash',this.value)"></div><div><label>Online/Bank ledger</label><input class="f" value="${esc(c.bank)}" onchange="tsave('bank',this.value)"></div></div>
 <label>புத்தகம் (Site)</label><select class="f" onchange="tsave('bid',this.value);render()"><option value="">எல்லா புத்தகங்கள்</option>${db.books.map(b=>`<option value="${b.id}" ${String(c.bid)===String(b.id)?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
 <div class="two"><div><label>தொடக்கம்</label><input type="date" class="f" value="${c.from}" onchange="tsave('from',this.value);render()"></div><div><label>முடிவு</label><input type="date" class="f" value="${c.to}" onchange="tsave('to',this.value);render()"></div></div>
 <p class="mut" style="margin-top:10px">${L.length} பதிவுகள் · வரவு ${ru(t.i)} · செலவு ${ru(t.o)}</p>
 <div class="acts"><button class="sbtn" onclick="tallyExport('m')">1️⃣ Ledgers XML</button><button class="sbtn" onclick="tallyExport('v')">2️⃣ Vouchers XML</button></div><div class="acts"><button class="pbtn" onclick="tallyBoth()">இரண்டையும் பதிவிறக்கு</button></div>
 <p class="mut">Tally-இல்: Gateway of Tally → Import → (Masters) Ledgers கோப்பு → பிறகு Vouchers கோப்பு. Party பெயர் இல்லாத பதிவுகளுக்கு Category பெயரே ledger ஆகும்.</p></div>`}
function togL(c){const l=lcats();const i=l.indexOf(c);if(i>=0)l.splice(i,1);else l.push(c);save()}
function backup(){dl('Skywall_CashBook_Backup_'+ld()+'.json',JSON.stringify(db),'application/json')}
function restore(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.books||!d.entries)throw 0;if(confirm('இப்போதுள்ள தரவு மாற்றப்படும். தொடரவா?')){db=d;save()}}catch(e){alert('தவறான Backup கோப்பு.')}})}
function mergeHub(h){if(!h||!h.cashBooks||!h.cashbook){alert('Hub Cash Book தரவு கிடைக்கவில்லை.');return}
 let nb=0,ne=0;const map={};h.cashBooks.forEach(b=>{let x=db.books.find(y=>y.name===b.name);if(!x){x={id:uid(),name:b.name,updated:Date.now()};db.books.push(x);nb++}map[b.id]=x.id});
 const pn=id=>((h.projects||[]).find(p=>String(p.id)===String(id))||{}).name||'';
 h.cashbook.forEach(e=>{const key='hub'+e.id;if(db.entries.some(x=>x.hubId===key))return;db.entries.push({id:uid(),hubId:key,bookId:map[e.bookId]||Object.values(map)[0],type:e.type==='IN'?'IN':'OUT',amount:+e.amount||0,date:e.date||ld(),time:'',party:e.person||'',partyType:'C',remark:[pn(e.projectId),e.desc,e.reference].filter(Boolean).join(' · '),category:e.category||'',mode:e.mode||'Cash',attach:[]});if(e.category&&!db.cats.includes(e.category))db.cats.push(e.category);if(e.mode&&!db.modes.includes(e.mode))db.modes.push(e.mode);ne++});
 save();alert(nb+' புத்தகங்கள், '+ne+' பதிவுகள் இறக்குமதி ஆனது.')}
function importHub(){try{mergeHub(JSON.parse(localStorage.getItem('skywall_hub_v1')))}catch(e){alert('இந்த browser-இல் Hub தரவு இல்லை. JSON கோப்பைப் பயன்படுத்தவும்.')}}
function importHubFile(i){const f=i.files[0];if(f)f.text().then(t=>{try{mergeHub(JSON.parse(t))}catch(e){alert('தவறான கோப்பு.')}})}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

  if(window.Android){
    window.print=function(){try{Android.print(document.title||'Skywall Cash Book Pro')}catch(e){}};
    if(typeof dl==='function'){dl=function(n,t,ty){try{Android.saveText(n,t,ty||'text/plain')}catch(e){alert('கோப்பைச் சேமிக்க முடியவில்லை')}}}
  }
})();
</script>
